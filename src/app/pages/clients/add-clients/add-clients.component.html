<mat-card class="add-clients">
  <mat-card-title class="add-clients__title">{{
    isEditMode
      ? (labels.title_edit | translate)
      : (labels.create_clients | translate)
  }}</mat-card-title>
  <mat-card-content>
    <form
      [formGroup]="form"
      class="add-products__form"
      (ngSubmit)="goSaveClient()"
    >
      <div class="add-clients__layout">
        <div class="add-clients__fields">
          <!-- NIF  -->
          <div class="add-clients__field-group">
            <label class="add-clients__label">{{
              labels.nif | translate
            }}</label>
            <mat-form-field appearance="outline" class="add-clients__field">
              <input matInput formControlName="nif" type="number" />
            </mat-form-field>
          </div>

          <!-- NOMBRE  -->
          <div class="add-clients__field-group">
            <label class="add-clients__label">{{
              labels.name | translate
            }}</label>
            <mat-form-field appearance="outline" class="add-clients__field">
              <input matInput formControlName="firstName" />
            </mat-form-field>
          </div>

          <!-- APELLIDOS -->
          <div class="add-clients__field-group">
            <label class="add-clients__label">{{
              labels.surname | translate
            }}</label>
            <mat-form-field appearance="outline" class="add-clients__field">
              <input matInput formControlName="lastName" />
            </mat-form-field>
          </div>

          <!-- EDITORIAL -->
          <div class="add-clients__field-group">
            <label class="add-clients__label">{{
              labels.publisher | translate
            }}</label>
            <mat-form-field appearance="outline" class="add-clients__field">
              <input matInput formControlName="companyName" />
            </mat-form-field>
          </div>

          <!-- MAIL -->
          <div class="add-clients__field-group">
            <label class="add-clients__label">{{
              labels.email | translate
            }}</label>
            <mat-form-field appearance="outline" class="add-clients__field">
              <input matInput formControlName="email" type="email" />
            </mat-form-field>
          </div>

          <!-- TELEFONO  -->
          <div class="add-clients__field-group">
            <label class="add-clients__label">{{
              labels.phone | translate
            }}</label>
            <mat-form-field appearance="outline" class="add-clients__field">
              <input matInput formControlName="phone" type="number" />
            </mat-form-field>
          </div>

          <!-- Direccion -->
          <div class="add-clients__field-group">
            <label class="add-clients__label">{{
              labels.address | translate
            }}</label>
            <mat-form-field appearance="outline" class="add-clients__field">
              <input matInput formControlName="address" />
            </mat-form-field>
          </div>

          <!-- CP  -->
          <div class="add-clients__field-group">
            <label class="add-clients__label">{{
              labels.postal | translate
            }}</label>
            <mat-form-field appearance="outline" class="add-clients__field">
              <input matInput formControlName="zip_code" type="number" />
            </mat-form-field>
          </div>

          <!-- Ciudad -->
          <div class="add-clients__field-group">
            <label class="add-clients__label">{{
              labels.city | translate
            }}</label>
            <mat-form-field appearance="outline" class="add-clients__field">
              <input matInput formControlName="city" />
            </mat-form-field>
          </div>

          <!-- Pais -->
          <div class="add-clients__field-group">
            <label class="add-clients__label">{{
              labels.country | translate
            }}</label>
            <mat-form-field appearance="outline" class="add-clients__field">
              <input matInput formControlName="country" />
            </mat-form-field>
          </div>
        </div>
      </div>

      <div class="add-clients__actions">
        <button
          mat-flat-button
          color="warn"
          type="button"
          class="add-clients__btn add-clients__btn--cancel"
          (click)="goCancel()"
        >
          {{ labels.btn_cancel | translate }}
        </button>
        <button
          mat-flat-button
          color="primary"
          type="submit"
          class="add-clients__btn add-clients__btn--save"
        >
          {{ labels.btn_save | translate }}
        </button>
      </div>
    </form>
  </mat-card-content>
</mat-card>
