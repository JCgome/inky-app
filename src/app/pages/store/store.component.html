<section class="stock">
  <div class="stock__head">
    <h1 class="stock__head-title">Almacen</h1>
    <div class="stock__head-actions">
      <button mat-fab class="stock__head-filter">
        <mat-icon>filter_list</mat-icon>
      </button>
    </div>
  </div>

  <div class="stock__cards">
    <mat-card class="stock__card">
      <div class="stock__card-total">
        <div class="stock__card-total-title">
          <span>Total de stock</span>
          <div class="stock__card-total-content">
            <h1>12.432</h1>
            <img
              src="../../../assets/img/images/in-stock.png"
              alt="image-total"
            />
          </div>
        </div>
      </div>
    </mat-card>

    <mat-card class="stock__card">
      <div class="stock__card-low">
        <div class="stock__card-low-title">
          <span>Productos Agotados</span>
          <div class="stock__card-low-content">
            <h1>5</h1>
            <img
              src="../../../assets/img/images/no-stock.png"
              alt="image-low"
            />
          </div>
        </div>
      </div>
    </mat-card>

    <mat-card class="stock__card">
      <div class="stock__card-hight">
        <div class="stock__card-hight-title">
          <span>Valor Total</span>
          <div class="stock__card-hight-content">
            <h1>30.931$</h1>
            <img
              src="../../../assets/img/images/presupuesto.png"
              alt="image-hight"
            />
          </div>
        </div>
      </div>
    </mat-card>
  </div>
  <div class="stock__table">
    <table mat-table [dataSource]="dataSource">
      <!-- Position Column -->
      <ng-container matColumnDef="isbn">
        <th mat-header-cell *matHeaderCellDef>ISBN</th>
        <td mat-cell *matCellDef="let element">{{ element.isbn }}</td>
      </ng-container>

      <!-- Name Column -->
      <ng-container matColumnDef="title">
        <th mat-header-cell *matHeaderCellDef>Producto</th>
        <td mat-cell *matCellDef="let element">{{ element.title }}</td>
      </ng-container>

      <!-- Weight Column -->
      <ng-container matColumnDef="stock">
        <th mat-header-cell *matHeaderCellDef>Stock</th>
        <td mat-cell *matCellDef="let element">{{ element.stock }}</td>
      </ng-container>

      <!-- Symbol Column -->
      <ng-container matColumnDef="symbol">
        <th mat-header-cell *matHeaderCellDef>Ultimo Movimiento</th>
        <td mat-cell *matCellDef="let element">{{ element.symbol }}</td>
      </ng-container>

      <!-- Symbol Column -->
      <ng-container matColumnDef="status">
        <th mat-header-cell *matHeaderCellDef>Estado</th>
        <td mat-cell *matCellDef="let element">{{ element.status }}</td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>

      <ng-container matColumnDef="description">
        <th mat-header-cell *matHeaderCellDef class="actions-column"></th>
        <td mat-cell *matCellDef="let element" class="actions-column">
          <button mat-icon-button color="basic">
            <mat-icon>info</mat-icon>
          </button>
        </td>
      </ng-container>
    </table>

    <mat-paginator
      #paginator
      [pageSize]="5"
      [hidePageSize]="true"
      showFirstLastButtons
    >
    </mat-paginator>
  </div>
</section>
