<section class="authors">
  <div class="authors__head">
    <h1 class="authors__head-title">{{ labels.title | translate }}</h1>
    <div class="authors__head-actions">
      <mat-form-field appearance="outline" class="authors__head-search">
        <input
          matInput
          (input)="applySearch($any($event.target).value)"
          [placeholder]="labels.search_ph | translate"
        />
        <mat-icon matSuffix>search</mat-icon>
      </mat-form-field>
      <button
        mat-flat-button
        color="primary"
        class="authors__head-new"
        (click)="openForm()"
      >
        {{ labels.new | translate }}
      </button>
    </div>
  </div>

  <app-spinner-cube *ngIf="loading"></app-spinner-cube>

  <div class="authors__table" [hidden]="loading">
    <table mat-table [dataSource]="dataSource">
      <ng-container matColumnDef="name">
        <th mat-header-cell *matHeaderCellDef>{{ labels.name | translate }}</th>
        <td mat-cell *matCellDef="let a" [title]="a.name">{{ a.name }}</td>
      </ng-container>

      <ng-container matColumnDef="books">
        <th mat-header-cell *matHeaderCellDef>
          {{ labels.books | translate }}
        </th>
        <td mat-cell *matCellDef="let a">{{ a.bookCount }}</td>
      </ng-container>

      <ng-container matColumnDef="actions">
        <th mat-header-cell *matHeaderCellDef>
          {{ labels.actions | translate }}
        </th>
        <td mat-cell *matCellDef="let a">
          <button
            mat-icon-button
            color="primary"
            [matTooltip]="labels.edit | translate"
            (click)="openForm(a)"
          >
            <mat-icon>edit</mat-icon>
          </button>
          <button
            mat-icon-button
            color="warn"
            [matTooltip]="
              (a.bookCount ? labels.delete_blocked : labels.delete) | translate
            "
            [disabled]="!!a.bookCount"
            (click)="remove(a)"
          >
            <mat-icon>delete</mat-icon>
          </button>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>

      <tr class="mat-row" *matNoDataRow>
        <td class="authors__empty" [attr.colspan]="displayedColumns.length">
          {{ labels.empty | translate }}
        </td>
      </tr>
    </table>

    <mat-paginator
      [pageSize]="8"
      [hidePageSize]="true"
      showFirstLastButtons
    ></mat-paginator>
  </div>
</section>
