<mat-card class="add-products">
  <mat-card-title class="add-products__title">
    {{
      isEditMode
        ? (labels.title_edit | translate)
        : (labels.title_products | translate)
    }}
  </mat-card-title>
  <mat-dialog-content class="add-products__content">
    <ng-container *ngIf="!isEditMode; else manualForm">
      <mat-tab-group animationDuration="0ms">
        <mat-tab [label]="tabLabels.manual | translate">
          <ng-container *ngTemplateOutlet="manualForm"></ng-container>
        </mat-tab>
        <mat-tab [label]="tabLabels.by_isbn | translate">
          <form
            [formGroup]="isbnForm"
            class="add-products__form"
            (ngSubmit)="guardarPorIsbn()"
          >
            <div class="add-products__layout">
              <div class="add-products__fields">
                <div class="add-products__field-group">
                  <label class="add-products__label">{{
                    labels.isbn | translate
                  }}</label>
                  <mat-form-field
                    appearance="outline"
                    class="add-products__field"
                  >
                    <input
                      matInput
                      formControlName="isbn"
                      type="text"
                      inputmode="numeric"
                    />
                  </mat-form-field>
                </div>

                <div class="add-products__field-group">
                  <label class="add-products__label">{{
                    labels.price | translate
                  }}</label>
                  <mat-form-field
                    appearance="outline"
                    class="add-products__field"
                  >
                    <input
                      matInput
                      formControlName="price"
                      type="number"
                      min="0"
                      step="0.01"
                    />
                  </mat-form-field>
                </div>

                <div class="add-products__field-group">
                  <label class="add-products__label">{{
                    labels.gender | translate
                  }}</label>
                  <mat-form-field
                    appearance="outline"
                    class="add-products__field"
                  >
                    <mat-select formControlName="categoryId">
                      <mat-option *ngFor="let x of categories" [value]="x.id">{{
                        x.name
                      }}</mat-option>
                    </mat-select>
                  </mat-form-field>
                </div>

                <div class="add-products__field-group">
                  <label class="add-products__label">{{
                    labels.format | translate
                  }}</label>
                  <mat-form-field
                    appearance="outline"
                    class="add-products__field"
                  >
                    <mat-select formControlName="format">
                      <mat-option *ngFor="let x of formats" [value]="x">{{
                        x
                      }}</mat-option>
                    </mat-select>
                  </mat-form-field>
                </div>

                <div class="add-products__field-group">
                  <label class="add-products__label">{{
                    labels.language | translate
                  }}</label>
                  <mat-form-field
                    appearance="outline"
                    class="add-products__field"
                  >
                    <input matInput formControlName="language" type="text" />
                  </mat-form-field>
                </div>

                <div class="add-products__field-group">
                  <label class="add-products__label">{{
                    labels.provider | translate
                  }}</label>
                  <mat-form-field
                    appearance="outline"
                    class="add-products__field"
                  >
                    <input matInput formControlName="providerName" />
                  </mat-form-field>
                </div>
              </div>
            </div>

            <div class="add-products__actions">
              <button
                mat-flat-button
                color="warn"
                type="button"
                class="add-products__btn add-products__btn--cancel"
                (click)="goCancel()"
              >
                {{ labels.btn_cancel | translate }}
              </button>
              <button
                mat-flat-button
                color="primary"
                type="submit"
                class="add-products__btn add-products__btn--save"
              >
                {{ labels.btn_save | translate }}
              </button>
            </div>
          </form>
        </mat-tab>
      </mat-tab-group>
    </ng-container>

    <ng-template #manualForm>
      <form
        [formGroup]="form"
        class="add-products__form"
        (ngSubmit)="guardarProducto()"
      >
        <div class="add-products__layout">
          <div class="add-products__fields">
            <!-- TITULO DEL LIBRO -->
            <div class="add-products__field-group">
              <label class="add-products__label">{{
                labels.title_books | translate
              }}</label>
              <mat-form-field appearance="outline" class="add-products__field">
                <input matInput formControlName="title" />
              </mat-form-field>
            </div>

            <!-- AUTOR-->
            <div class="add-products__field-group">
              <label class="add-products__label">{{
                labels.author | translate
              }}</label>
              <mat-form-field appearance="outline" class="add-products__field">
                <mat-select formControlName="authorIds" multiple>
                  <mat-option *ngFor="let x of authors" [value]="x.id">{{
                    x.name
                  }}</mat-option>
                </mat-select>
              </mat-form-field>
            </div>

            <!-- ISBN -->
            <div class="add-products__field-group">
              <label class="add-products__label">{{
                labels.isbn | translate
              }}</label>
              <mat-form-field appearance="outline" class="add-products__field">
                <input
                  matInput
                  formControlName="isbn"
                  type="text"
                  maxlength="13"
                  inputmode="numeric"
                />
              </mat-form-field>
            </div>

            <!-- AÑO PUBLICACION -->
            <div class="add-products__field-group">
              <label class="add-products__label">{{
                labels.year_publish | translate
              }}</label>
              <mat-form-field appearance="outline" class="add-products__field">
                <input matInput formControlName="yearPublished" type="number" />
              </mat-form-field>
            </div>

            <!-- PRECIO -->
            <div class="add-products__field-group">
              <label class="add-products__label">{{
                labels.price | translate
              }}</label>
              <mat-form-field appearance="outline" class="add-products__field">
                <input
                  matInput
                  formControlName="price"
                  type="number"
                  min="0"
                  step="0.01"
                />
              </mat-form-field>
            </div>

            <!-- CATEGORIA -->
            <div class="add-products__field-group">
              <label class="add-products__label">
                {{ labels.gender | translate }}
              </label>
              <mat-form-field appearance="outline" class="add-products__field">
                <mat-select formControlName="categoryId">
                  <mat-option *ngFor="let x of categories" [value]="x.id">{{
                    x.name
                  }}</mat-option>
                </mat-select>
              </mat-form-field>
            </div>

            <!-- NUM PAGINAS -->
            <div class="add-products__field-group">
              <label class="add-products__label">{{
                labels.number_pag | translate
              }}</label>
              <mat-form-field appearance="outline" class="add-products__field">
                <input matInput formControlName="pages" type="number" />
              </mat-form-field>
            </div>

            <!-- FORMATO -->
            <div class="add-products__field-group">
              <label class="add-products__label">{{
                labels.format | translate
              }}</label>
              <mat-form-field appearance="outline" class="add-products__field">
                <mat-select formControlName="format">
                  <mat-option *ngFor="let x of formats" [value]="x">{{
                    x
                  }}</mat-option>
                </mat-select>
              </mat-form-field>
            </div>

            <!-- IDIOMA -->
            <div class="add-products__field-group">
              <label class="add-products__label">{{
                labels.language | translate
              }}</label>
              <mat-form-field appearance="outline" class="add-products__field">
                <input matInput formControlName="language" type="text" />
              </mat-form-field>
            </div>

            <!-- EDITORIAL -->
            <div class="add-products__field-group">
              <label class="add-products__label">{{
                labels.publisher | translate
              }}</label>
              <mat-form-field appearance="outline" class="add-products__field">
                <mat-select formControlName="publisherId">
                  <mat-option *ngFor="let x of publishers" [value]="x.id">{{
                    x.name
                  }}</mat-option>
                </mat-select>
              </mat-form-field>
            </div>

            <!-- PROOVEDOR -->
            <div class="add-products__field-group">
              <label class="add-products__label">{{
                labels.provider | translate
              }}</label>
              <mat-form-field appearance="outline" class="add-products__field">
                <input matInput formControlName="providerName" />
              </mat-form-field>
            </div>
          </div>
        </div>

        <div class="add-products__image-wrapper">
          <label class="add-products__label">{{
            labels.image_product | translate
          }}</label>
          <mat-form-field appearance="outline" class="add-products__field">
            <input matInput formControlName="imageUrl" placeholder="https://" />
          </mat-form-field>
        </div>

        <!-- Botones -->
        <div class="add-products__actions">
          <button
            mat-flat-button
            color="warn"
            type="button"
            class="add-products__btn add-products__btn--cancel"
            (click)="goCancel()"
          >
            {{ labels.btn_cancel | translate }}
          </button>
          <button
            mat-flat-button
            color="primary"
            type="submit"
            class="add-products__btn add-products__btn--save"
          >
            {{ labels.btn_save | translate }}
          </button>
        </div>
      </form>
    </ng-template>
  </mat-dialog-content>
</mat-card>
