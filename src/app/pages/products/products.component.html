<section class="products">
  <div class="products__container">
    <div class="products__head head-responsive">
      <h2>{{ labels.product | translate }}</h2>
      <div class="products__head-actions">
        <button
          mat-flat-button
          color="primary"
          class="products__head-actions-new"
          (click)="goAddProducts()"
        >
          {{ labels.add_product | translate }}
        </button>
        <button mat-fab class="products__head-actions-filter">
          <mat-icon>filter_list</mat-icon>
        </button>
      </div>
    </div>
    <div class="products__table table-responsive">
      <table mat-table [dataSource]="dataSource" class="mat-elevation-z8">
        <!-- Columna ID -->
        <ng-container matColumnDef="isbn">
          <th mat-header-cell *matHeaderCellDef>
            {{ labels.isbn | translate }}
          </th>
          <td mat-cell *matCellDef="let element">{{ element.isbn }}</td>
        </ng-container>

        <!-- Columna Nombre -->
        <ng-container matColumnDef="title">
          <th mat-header-cell *matHeaderCellDef>
            {{ labels.title_book | translate }}
          </th>
          <td mat-cell *matCellDef="let element">{{ element.title }}</td>
        </ng-container>

        <!-- Columna Precio -->
        <ng-container matColumnDef="stock">
          <th mat-header-cell *matHeaderCellDef>
            {{ labels.stock | translate }}
          </th>
          <td mat-cell *matCellDef="let element">{{ element.stock }}</td>
        </ng-container>

        <!-- Columna Categoría -->
        <ng-container matColumnDef="gender">
          <th mat-header-cell *matHeaderCellDef>
            {{ labels.category | translate }}
          </th>
          <td mat-cell *matCellDef="let element">{{ element.gender }}</td>
        </ng-container>

        <!-- Columna Acciones -->
        <ng-container matColumnDef="actions">
          <th mat-header-cell *matHeaderCellDef class="actions-column"></th>
          <td mat-cell *matCellDef="let element" class="actions-column">
            <button
              mat-icon-button
              color="primary"
              (click)="goeditProducts(element.id); $event.stopPropagation()"
            >
              <mat-icon>edit</mat-icon>
            </button>
            <button
              mat-icon-button
              color="warn"
              (click)="goDeleteProduct(element.id); $event.stopPropagation()"
            >
              <mat-icon>delete</mat-icon>
            </button>
          </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr
          mat-row
          *matRowDef="let row; columns: displayedColumns"
          (click)="goviewProduct(row.id)"
          class="clickable-row"
        ></tr>
      </table>

      <mat-paginator
        #paginator
        [pageSize]="10"
        [hidePageSize]="true"
        showFirstLastButtons
      ></mat-paginator>
    </div>
  </div>
</section>
