<section class="products">
  <div class="products__container">
    <div class="products__head head-responsive">
      <h2>{{ labels.product | translate }}</h2>
      <div class="products__head-actions">
        <button
          mat-flat-button
          color="primary"
          class="products__head-actions-new"
        >
          {{ labels.add_product | translate }}
        </button>
        <button mat-fab class="products__head-actions-filter">
          <mat-icon>filter_list</mat-icon>
        </button>
      </div>
    </div>
    <div class="products__table table-responsive">
      <table mat-table [dataSource]="dataSource" class="mat-elevation-z8">
        <!-- Columna ID -->
        <ng-container matColumnDef="id">
          <th mat-header-cell *matHeaderCellDef>
            {{ "PRODUCT.CODE" | translate }}
          </th>
          <td mat-cell *matCellDef="let element">{{ element.id }}</td>
        </ng-container>

        <!-- Columna Nombre -->
        <ng-container matColumnDef="nombre">
          <th mat-header-cell *matHeaderCellDef>
            {{ "PRODUCT.NAME" | translate }}
          </th>
          <td mat-cell *matCellDef="let element">{{ element.nombre }}</td>
        </ng-container>

        <!-- Columna Precio -->
        <ng-container matColumnDef="precio">
          <th mat-header-cell *matHeaderCellDef>
            {{ "PRODUCT.STOCK" | translate }}
          </th>
          <td mat-cell *matCellDef="let element">{{ element.precio }}</td>
        </ng-container>

        <!-- Columna Categoría -->
        <ng-container matColumnDef="categoria">
          <th mat-header-cell *matHeaderCellDef>
            {{ "PRODUCT.CATEGORY" | translate }}
          </th>
          <td mat-cell *matCellDef="let element">{{ element.categoria }}</td>
        </ng-container>

        <!-- Columna Acciones -->
        <ng-container matColumnDef="acciones">
          <th mat-header-cell *matHeaderCellDef class="actions-column"></th>
          <td mat-cell *matCellDef="let element" class="actions-column">
            <button mat-icon-button color="primary">
              <mat-icon>edit</mat-icon>
            </button>
            <button mat-icon-button color="warn">
              <mat-icon>delete</mat-icon>
            </button>
          </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
      </table>

      <mat-paginator
        #paginator
        [pageSize]="10"
        [hidePageSize]="true"
        showFirstLastButtons
      ></mat-paginator>
    </div>
  </div>
</section>
