<section class="login-container">
  <div class="login">
    <div class="logo">
      <img src="../../../../../assets/img/logo/logo.png" alt="" />
    </div>
    <h1>login</h1>
    <form action="">
      <div class="login-email">
        <p>Email:</p>
        <mat-form-field appearance="outline" class="email">
          <input matInput placeholder="inky@gmail.com" />
        </mat-form-field>
      </div>
      <p>Contraseña:</p>
      <div class="login-password">
        <mat-form-field appearance="outline" class="password">
          <input matInput placeholder="XXX-XXX" />
          <mat-icon matSuffix>visibility_off</mat-icon>
        </mat-form-field>
      </div>

      <div class="remember-forgot">
        <mat-checkbox labelPosition="before">Recordar</mat-checkbox>
        <a href="#">¿Olvidaste la contraseña?</a>
      </div>
      <div class="go-login">
        <button mat-flat-button color="primary">Acceder</button>
        <button mat-flat-button color="accent">Cancelar</button>
      </div>
      <div class="register">
        <p>¿No tienes cuenta?</p>
        <a href="#">Registrar</a>
      </div>
    </form>
  </div>
</section>
