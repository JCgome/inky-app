<section class="navbar">
  <mat-toolbar color="primary">
    <button mat-icon-button (click)="toggleMenu()" *ngIf="!isTabletOrMobile()">
      <mat-icon>menu</mat-icon>
    </button>

    <h1 class="navbar__title">{{ "home.logo" | translate }}</h1>

    <span class="navbar__spacer"></span>

    <div class="navbar__language">
      <button
        mat-icon-button
        [matMenuTriggerFor]="languageMenu"
        class="navbar__language-button"
      >
        <img
          [src]="getFlagSelected()"
          class="navbar__language-flag"
          alt="Idioma seleccionado"
        />
      </button>
      <mat-menu #languageMenu="matMenu">
        <button
          mat-menu-item
          *ngFor="let lang of languages"
          (click)="cambiarIdioma(lang.code)"
        >
          <img
            [src]="lang.flag"
            class="navbar__language-flag"
            alt="Bandera de {{ lang.code }}"
          />
        </button>
      </mat-menu>
    </div>

    <div class="navbar__buttons-actions">
      <button mat-icon-button>
        <mat-icon>account_circle</mat-icon>
      </button>

      <button mat-icon-button>
        <mat-icon>logout</mat-icon>
      </button>
    </div>
  </mat-toolbar>
</section>
