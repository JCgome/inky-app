<div class="not-found">
  <div class="not-found__image">
    <img src="assets/img/image-404.jpg" [alt]="'not_found.title' | translate" />
  </div>

  <div class="not-found__content">
    <h1 class="not-found__content-heading">404</h1>
    <h3 class="not-found__content-title">{{ "not_found.title" | translate }}</h3>
    <p class="not-found__content-text">
      {{ "not_found.text" | translate }}
    </p>
    <button
      class="not-found__content-button"
      mat-raised-button
      (click)="goHome()"
    >
      {{ "not_found.button" | translate }}
    </button>
  </div>
</div>
