<div class="not-found">
  <div class="not-found__image">
    <img src="assets/img/image-404.jpg" alt="Not Found" />
  </div>

  <div class="not-found__content">
    <h1 class="not-found__content-heading">404</h1>
    <h3 class="not-found__content-title">Oops... parece que te perdiste.</h3>
    <p class="not-found__content-text">
      No encontramos lo que buscas, pero podemos ayudarte a volver al inicio
    </p>
    <button
      class="not-found__content-button"
      mat-raised-button
      (click)="goHome()"
    >
      Acceder
    </button>
  </div>
</div>
